[Audio]
; Supported sample rates: 44100 or 48000 Hz.
; Stop and dispose ASIO buffers before changing the rate.
SampleRate=48000

; Multiples of 48, from 48 through 1008 samples. The host may choose another size.
; Durations at 48 kHz: 48 = 1 ms, 96 = 2 ms, 144 = 3 ms, 192 = 4 ms.
; If you hear crackles or the control panel shows output dropouts, choose a larger size.
BufferSize=96

; Optional USB capture request duration: 0 leaves the Windows default unchanged.
; Try 3 ms for lower capture latency; supported requests are 3 through 10 ms.
; The control panel shows acceptance or rejection. For accepted 3 ms requests at
; 48, 96 and 144 samples, the driver reports the input delay measured on a UMC22.
; Smaller requests increase USB processing frequency and may affect stability.
CaptureBufferMs=0

; Optional output safety: 0, 1 or 2 extra output buffers. Each extra buffer lets the
; host be one buffer late without a crackle, and adds one buffer of output latency.
; For example, 48 samples with 1 extra buffer has the output latency of 96 samples,
; but 1 ms less input latency. The control panel can change this too.
ExtraOutputBuffers=0

; Optional: select the audio device by name instead of by the UMC22 hardware ID.
; Case-insensitive; part of the name is enough. Use the name shown in Device Manager
; under "Sound, video and game controllers" (a UMC22 usually appears as "USB Audio CODEC").
; If several devices share that name, use part of the device instance path instead
; (Device Manager > Properties > Details > Device instance path), e.g. 7&1A2B3C4D&0.
; Leave empty to use the first device with hardware ID VID_08BB&PID_2902.
DeviceName=

; Optional latency correction in microseconds (may be negative). It is added to the
; latency reported to hosts, which use it to line up recordings. A UMC22 needs none:
; the built-in figures are measured on one. For other setups, measure with
; tools/latency_test and a loopback cable; "latency_test --write" fills it in.
InputLatencyOffset=0
OutputLatencyOffset=0
