<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" aria-labelledby="title description" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Understanding audio latency in ASIO-for-UMC22</title>
  <desc id="description">Monitoring through the DAW includes input, processing and output. With 96 samples at 48 kHz, 3 ms capture requests and one extra output buffer, the driver reports 9.67 ms input plus 4 ms output, or 13.67 ms total. Loopback measured 12.67 to 13.67 ms on the tested UMC22. The diagram explains how buffer size, capture requests, output safety and calibration affect latency.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .line { stroke: #818b98; fill: none; }
    .divider { stroke: #d1d9e0; }
    .neutral { fill: #f6f8fa; stroke: #d1d9e0; }
    .input { fill: #ddf4ff; stroke: #0969da; }
    .output { fill: #fff1e5; stroke: #bc4c00; }
    .arrow { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .divider { stroke: #3d444d; }
      .neutral { fill: #161b22; stroke: #3d444d; }
      .input { fill: #0c2d4f; stroke: #4493f8; }
      .output { fill: #3d1d00; stroke: #f0883e; }
      .arrow { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="780" rx="8"/>

  <text x="28" y="36" class="text" font-size="24" font-weight="600">Understanding audio latency</text>
  <text x="28" y="62" class="muted" font-size="15">Settings change waiting time. The latency report helps the DAW place recordings in time.</text>

  <text x="28" y="101" class="text" font-size="17" font-weight="600">1. When you listen to the input through the DAW</text>
  <g font-size="15">
    <rect class="input" x="28" y="118" width="280" height="102" rx="7"/>
    <text x="44" y="145" class="text" font-size="17" font-weight="600">Input path</text>
    <text x="44" y="171" class="text">Input jack → interface → USB</text>
    <text x="44" y="197" class="muted">Recorded audio waits for the DAW.</text>

    <rect class="neutral" x="340" y="118" width="280" height="102" rx="7"/>
    <text x="356" y="145" class="text" font-size="17" font-weight="600">Your DAW</text>
    <text x="356" y="171" class="text">Processes each audio buffer.</text>
    <text x="356" y="197" class="muted">Some plugins add further delay.</text>

    <rect class="output" x="652" y="118" width="280" height="102" rx="7"/>
    <text x="668" y="145" class="text" font-size="17" font-weight="600">Output path</text>
    <text x="668" y="171" class="text">Playback queue → USB → interface</text>
    <text x="668" y="197" class="muted">Sound reaches the output jack.</text>
  </g>
  <g class="line" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M314,168 H332"/>
    <path d="M626,168 H644"/>
  </g>
  <text x="28" y="243" class="muted" font-size="14">Processing takes time and must meet the audio deadline. Direct hardware monitoring bypasses the DAW.</text>

  <text x="28" y="283" class="text" font-size="17" font-weight="600">2. Example: driver report, excluding extra DAW or plugin latency</text>
  <text x="28" y="308" class="muted" font-size="14">96 samples at 48 kHz = 2 ms per buffer · CaptureBufferMs=3 (accepted) · ExtraOutputBuffers=1 · Zero offsets</text>
  <rect class="input" x="28" y="324" width="430" height="74" rx="7"/>
  <text x="44" y="348" class="text" font-size="14">Input estimate</text>
  <text x="44" y="381" class="text" font-size="27" font-weight="600">9.67 ms</text>
  <text x="480" y="372" class="muted" font-size="26" text-anchor="middle">+</text>
  <rect class="output" x="502" y="324" width="430" height="74" rx="7"/>
  <text x="518" y="348" class="text" font-size="14">Output estimate, including one extra buffer</text>
  <text x="518" y="381" class="text" font-size="27" font-weight="600">4.00 ms</text>
  <rect class="neutral" x="28" y="410" width="904" height="52" rx="7"/>
  <text x="44" y="443" class="text" font-size="17" font-weight="600">Reported total</text>
  <text x="916" y="444" class="text" font-size="24" font-weight="600" text-anchor="end">9.67 + 4.00 = 13.67 ms</text>
  <text x="28" y="486" class="muted" font-size="14">Loopback measured 12.67–13.67 ms for this setup; timing varies between starts.</text>
  <text x="28" y="508" class="muted" font-size="14">The cable test measures the total. It does not measure input and output separately.</text>

  <text x="28" y="548" class="text" font-size="17" font-weight="600">3. What each setting changes</text>
  <g font-size="14">
    <text x="44" y="584" class="text" font-weight="600">BufferSize</text>
    <text x="278" y="584" class="text">Smaller buffers mean less waiting and a shorter processing deadline.</text>
    <line x1="28" y1="603" x2="932" y2="603" class="divider"/>

    <text x="44" y="625" class="text" font-weight="600">CaptureBufferMs=3</text>
    <text x="278" y="625" class="text">Requests smaller USB capture batches. Total input delay is still more than 3 ms.</text>
    <line x1="28" y1="644" x2="932" y2="644" class="divider"/>

    <text x="44" y="666" class="text" font-weight="600">ExtraOutputBuffers</text>
    <text x="278" y="666" class="text">Adds playback safety. Each extra buffer adds 2 ms in this example.</text>
    <line x1="28" y1="685" x2="932" y2="685" class="divider"/>

    <text x="44" y="707" class="text" font-weight="600">Latency offsets</text>
    <text x="278" y="707" class="text">Correct recording placement; do not shorten the delay you hear.</text>
  </g>
  <text x="28" y="752" class="muted" font-size="14">Measure again after changing the device, sample rate, buffers, capture setting or output safety.</text>
</svg>
