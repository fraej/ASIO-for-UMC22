<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Where the latency of ASIO-for-UMC22 comes from</title>
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .line { stroke: #59636e; fill: none; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .fixed { fill: #eaeef2; stroke: #818b98; }
    .in { fill: #ddf4ff; stroke: #0969da; }
    .out { fill: #fff1e5; stroke: #bc4c00; }
    .ink-in { fill: #0969da; }
    .ink-out { fill: #bc4c00; }
    .ink-fixed { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .box { fill: #161b22; stroke: #3d444d; }
      .fixed { fill: #262c36; stroke: #9198a1; }
      .in { fill: #0c2d4f; stroke: #4493f8; }
      .out { fill: #3d1d00; stroke: #f0883e; }
      .ink-in { fill: #4493f8; }
      .ink-out { fill: #f0883e; }
      .ink-fixed { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ink-fixed"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="660" rx="8"/>

  <text x="24" y="34" class="t" font-size="19" font-weight="600">Where the latency comes from</text>
  <text x="24" y="55" class="m" font-size="13">Example: 96-sample buffers (2 ms at 48 kHz) with both optional settings on: CaptureBufferMs=3 and one extra output buffer</text>

  <!-- 1. The signal path -->
  <text x="24" y="90" class="t" font-size="14" font-weight="600">1. The path of a sound, from the input jack to the speakers</text>
  <g font-size="12" text-anchor="middle">
    <rect class="fixed" x="24" y="104" width="130" height="128" rx="6"/>
    <text x="89" y="128" class="t" font-size="13" font-weight="600">Input jack</text>
    <text x="89" y="150" class="m">converter (ADC)</text>
    <text x="89" y="166" class="m">turns sound</text>
    <text x="89" y="182" class="m">into samples</text>

    <rect class="fixed" x="180" y="104" width="130" height="128" rx="6"/>
    <text x="245" y="128" class="t" font-size="13" font-weight="600">Windows USB</text>
    <text x="245" y="150" class="m">driver records in</text>
    <text x="245" y="166" class="m">blocks: 10 ms, or</text>
    <text x="245" y="182" class="m">3 ms with</text>
    <text x="245" y="198" class="m">CaptureBufferMs=3</text>

    <rect class="in" x="336" y="104" width="130" height="128" rx="6" stroke-dasharray="5 3"/>
    <text x="401" y="128" class="t" font-size="13" font-weight="600">Capture queue</text>
    <text x="401" y="150" class="m">recorded input</text>
    <text x="401" y="166" class="m">waits here; input</text>
    <text x="401" y="182" class="m">alignment skips what</text>
    <text x="401" y="198" class="m">always waited too</text>
    <text x="401" y="214" class="m">long, keeps a reserve</text>

    <rect class="in" x="492" y="104" width="130" height="128" rx="6"/>
    <text x="557" y="128" class="t" font-size="13" font-weight="600">Input buffer</text>
    <text x="557" y="150" class="m">the DAW receives</text>
    <text x="557" y="166" class="m">96 samples (2 ms)</text>
    <text x="557" y="182" class="m">at once, so it waits</text>
    <text x="557" y="198" class="m">until all arrived</text>

    <rect class="box" x="648" y="104" width="130" height="128" rx="6"/>
    <text x="713" y="128" class="t" font-size="13" font-weight="600">Your DAW</text>
    <text x="713" y="150" class="m">processes the input</text>
    <text x="713" y="166" class="m">and returns an</text>
    <text x="713" y="182" class="m">output buffer</text>
    <text x="713" y="198" class="m">(takes no extra time)</text>

    <rect class="out" x="804" y="104" width="132" height="128" rx="6"/>
    <text x="870" y="128" class="t" font-size="13" font-weight="600">Output queue</text>
    <text x="870" y="150" class="m">1 buffer playing</text>
    <text x="870" y="166" class="m">+ extra buffers,</text>
    <text x="870" y="182" class="m">then USB, DAC and</text>
    <text x="870" y="198" class="m">the output jack</text>
  </g>
  <g class="line" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="156" y1="163" x2="177" y2="163"/>
    <line x1="312" y1="163" x2="333" y2="163"/>
    <line x1="468" y1="163" x2="489" y2="163"/>
    <line x1="624" y1="163" x2="645" y2="163"/>
    <line x1="780" y1="163" x2="801" y2="163"/>
  </g>

  <!-- 2. The round trip as a time line -->
  <text x="24" y="266" class="t" font-size="14" font-weight="600">2. The same path as time: what the DAW is told, and what a loopback cable measures</text>

  <!-- Brackets: 64.4 px per ms, starting at x = 40 -->
  <g class="line" stroke-width="1.5">
    <path d="M40,306 v-8 h621 v8"/>
    <path d="M665,306 v-8 h255 v8"/>
  </g>
  <text x="350" y="290" class="ink-in" font-size="14" font-weight="600" text-anchor="middle">Input latency about 10 ms</text>
  <text x="792" y="290" class="ink-out" font-size="14" font-weight="600" text-anchor="middle">Output latency 4 ms</text>

  <g font-size="12" text-anchor="middle">
    <rect class="fixed" x="40" y="312" width="365" height="58" rx="4"/>
    <text x="222" y="336" class="t" font-weight="600">USB driver + both converters</text>
    <text x="222" y="354" class="m">about 6 ms, the same at every buffer size</text>

    <rect class="in" x="405" y="312" width="129" height="58" rx="4" stroke-dasharray="5 3"/>
    <text x="469" y="336" class="t" font-weight="600">Reserve</text>
    <text x="469" y="354" class="m">1 buffer = 2 ms</text>

    <rect class="in" x="534" y="312" width="129" height="58" rx="4"/>
    <text x="598" y="336" class="t" font-weight="600">Input buffer</text>
    <text x="598" y="354" class="m">1 buffer = 2 ms</text>

    <rect class="out" x="663" y="312" width="129" height="58" rx="4"/>
    <text x="727" y="336" class="t" font-weight="600">Output buffer</text>
    <text x="727" y="354" class="m">1 buffer = 2 ms</text>

    <rect class="out" x="792" y="312" width="129" height="58" rx="4" stroke-dasharray="5 3"/>
    <text x="856" y="336" class="t" font-weight="600">Extra buffer</text>
    <text x="856" y="354" class="m">1 buffer = 2 ms</text>
  </g>

  <g class="line" stroke-width="1.5">
    <path d="M40,378 v8 h881 v-8"/>
  </g>
  <text x="480" y="406" class="t" font-size="14" font-weight="600" text-anchor="middle">Round trip about 14 ms: the driver reports this total to the DAW</text>
  <text x="480" y="426" class="m" font-size="12" text-anchor="middle">The DAW moves recordings earlier by it, so what you record lines up with what you heard. On a UMC22 it matches a loopback measurement.</text>
  <text x="480" y="443" class="m" font-size="12" text-anchor="middle">With Windows' default capture, the grey block and the reserve become one wait of about 12 ms: about 18 ms in this example.</text>

  <!-- 3. What each setting changes -->
  <text x="24" y="484" class="t" font-size="14" font-weight="600">3. What each setting changes</text>
  <g font-size="13">
    <rect class="in" x="24" y="500" width="14" height="14" rx="3"/>
    <text x="48" y="512" class="t" font-weight="600">Buffer size</text>
    <text x="230" y="512" class="m">Every buffer block grows: input, reserve, output and extra. Larger is safer against crackles, but slower.</text>

    <rect class="fixed" x="24" y="532" width="14" height="14" rx="3"/>
    <text x="48" y="544" class="t" font-weight="600">CaptureBufferMs=3</text>
    <text x="230" y="544" class="m">Shrinks the USB wait from about 12 ms to about 6 ms plus a 1-buffer reserve. Helps at 48, 96 and 144 samples.</text>

    <rect class="out" x="24" y="564" width="14" height="14" rx="3"/>
    <text x="48" y="576" class="t" font-weight="600">ExtraOutputBuffers</text>
    <text x="230" y="576" class="m">Adds output buffers only. Each lets the DAW be one buffer late without a crackle, and adds one buffer.</text>

    <rect class="box" x="24" y="596" width="14" height="14" rx="3"/>
    <text x="48" y="608" class="t" font-weight="600">Latency offsets</text>
    <text x="230" y="608" class="m">Only change the number reported to the DAW, never the sound. A UMC22 needs none.</text>
  </g>
  <text x="24" y="640" class="m" font-size="11">Dashed blocks are optional: they appear only with CaptureBufferMs=3 or extra output buffers.</text>
</svg>
