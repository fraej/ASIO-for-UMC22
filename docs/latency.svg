<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1150" width="960" height="1150" role="img" aria-labelledby="title description" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">What adds up to the audio delay?</title>
  <desc id="description">Rounded examples at 48 kHz, with accepted 3 ms USB capture requests and one extra output buffer. With 96 samples, each buffer holds 2 ms: 2 ms input buffer plus a 2 ms queue allowance plus about 6 ms estimated from cable tests gives about 10 ms input; two output buffers give 4 ms output, for about 14 ms total. With 48 samples, each buffer holds 1 ms: 1 plus 1 plus 6 gives about 8 ms input; 1 plus 1 gives 2 ms output, for about 10 ms total. These are the driver's estimates; a cable test measures only the combined delay. Other setups can differ.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .connector { stroke: #59636e; stroke-width: 2; fill: none; }
    .divider { stroke: #d1d9e0; }
    .neutral { fill: #f6f8fa; stroke: #d1d9e0; }
    .input { fill: #ddf4ff; stroke: #0969da; }
    .output { fill: #fff1e5; stroke: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .connector { stroke: #9198a1; }
      .divider { stroke: #3d444d; }
      .neutral { fill: #161b22; stroke: #3d444d; }
      .input { fill: #0c2d4f; stroke: #4493f8; }
      .output { fill: #3d1d00; stroke: #f0883e; }
    }
  </style>
  <rect class="bg" width="960" height="1150" rx="8"/>

  <text x="28" y="36" class="text" font-size="25" font-weight="600">What adds up to the delay?</text>
  <text x="28" y="62" class="muted" font-size="15">Example: 96 samples at 48 kHz · 3 ms USB capture requests accepted · 1 extra output buffer</text>
  <rect class="neutral" x="28" y="78" width="904" height="50" rx="7"/>
  <text x="44" y="110" class="text" font-size="18" font-weight="600">One buffer holds 2 ms of sound.</text>
  <text x="916" y="109" class="muted" font-size="14" text-anchor="end">Times are rounded. No calibration offsets.</text>

  <text x="28" y="166" class="text" font-size="18" font-weight="600">1. Input: getting sound into your audio program</text>
  <rect class="input" x="28" y="182" width="904" height="184" rx="7"/>
  <rect class="neutral" x="648" y="136" width="268" height="58" rx="7"/>
  <text x="664" y="159" class="text" font-size="15" font-weight="600">3 ms USB capture requests</text>
  <text x="664" y="181" class="muted" font-size="14">used in these cable tests</text>
  <path d="M694,195 V209 M689,204 L694,209 L699,204" class="connector"/>
  <g class="text" font-size="30" font-weight="600">
    <text x="60" y="238">2 ms</text>
    <text x="362" y="238">2 ms</text>
    <text x="664" y="238">6 ms</text>
  </g>
  <g class="text" font-size="16" font-weight="600">
    <text x="60" y="269">Fill an input buffer</text>
    <text x="362" y="269">Allow for queued input</text>
    <text x="664" y="269">Other delay in the estimate</text>
  </g>
  <g class="muted" font-size="15">
    <text x="60" y="294">Collect one chunk of sound</text>
    <text x="60" y="315">before passing it to the program.</text>
    <text x="362" y="294">One more buffer of waiting</text>
    <text x="362" y="315">included in the driver's estimate.</text>
    <text x="664" y="294">USB and interface delays, estimated</text>
    <text x="664" y="315">with the 3 ms USB setting active.</text>
  </g>
  <g class="muted" font-size="27" text-anchor="middle">
    <text x="326" y="239">+</text>
    <text x="628" y="239">+</text>
  </g>
  <text x="480" y="345" class="text" font-size="23" font-weight="600" text-anchor="middle">2 + 2 + 6 = about 10 ms input</text>
  <text x="28" y="391" class="muted" font-size="14">The 3 ms setting is already reflected in the 6 ms estimate. Do not add another 3 ms.</text>

  <text x="28" y="431" class="text" font-size="18" font-weight="600">2. Output: getting sound back to the output jack</text>
  <rect class="output" x="28" y="447" width="904" height="112" rx="7"/>
  <g class="text" font-size="30" font-weight="600">
    <text x="60" y="484">2 ms</text>
    <text x="518" y="484">2 ms</text>
  </g>
  <g class="text" font-size="16" font-weight="600">
    <text x="60" y="510">Normal playback buffer</text>
    <text x="518" y="510">One extra safety buffer</text>
  </g>
  <text x="480" y="485" class="muted" font-size="27" text-anchor="middle">+</text>
  <text x="480" y="544" class="text" font-size="23" font-weight="600" text-anchor="middle">2 + 2 = 4 ms output</text>
  <text x="28" y="584" class="muted" font-size="14">Your audio program must process each chunk in time. Some plugins add further delay.</text>

  <rect class="neutral" x="28" y="604" width="904" height="60" rx="7"/>
  <text x="44" y="642" class="text" font-size="18" font-weight="600">Estimated total</text>
  <text x="916" y="643" class="text" font-size="25" font-weight="600" text-anchor="end">about 10 ms + 4 ms = about 14 ms</text>
  <text x="28" y="690" class="muted" font-size="14">Cable tests measured about 13–14 ms for this setup. Timing can vary between starts.</text>
  <text x="28" y="712" class="muted" font-size="14">The test measures the combined delay. The input/output split above is the driver's model.</text>

  <text x="28" y="751" class="text" font-size="18" font-weight="600">3. Now use 48 samples instead</text>
  <text x="28" y="776" class="muted" font-size="14">Same 48 kHz, 3 ms USB requests and 1 extra output buffer. Each buffer now holds 1 ms.</text>
  <rect class="input" x="28" y="790" width="280" height="88" rx="7"/>
  <rect class="output" x="340" y="790" width="280" height="88" rx="7"/>
  <rect class="neutral" x="652" y="790" width="280" height="88" rx="7"/>
  <g class="text" font-size="15" font-weight="600">
    <text x="44" y="817">Input estimate</text>
    <text x="356" y="817">Output estimate</text>
    <text x="668" y="817">Total estimate</text>
  </g>
  <g class="text" font-size="21" font-weight="600">
    <text x="44" y="853">1 + 1 + 6 = about 8 ms</text>
    <text x="356" y="853">1 + 1 = 2 ms</text>
    <text x="668" y="853">8 + 2 = about 10 ms</text>
  </g>
  <text x="28" y="904" class="muted" font-size="14">About 4 ms less overall delay than the 96-sample example, with less time to finish each buffer.</text>

  <g transform="translate(0 200)">
  <text x="28" y="751" class="text" font-size="18" font-weight="600">What the settings change</text>
  <g font-size="14">
    <text x="44" y="786" class="text" font-weight="600">BufferSize</text>
    <text x="278" y="786" class="text">Smaller chunks mean less waiting, but less time to finish processing.</text>
    <line x1="28" y1="800" x2="932" y2="800" class="divider"/>
    <text x="44" y="821" class="text" font-weight="600">CaptureBufferMs</text>
    <text x="278" y="821" class="text">Changes USB batching. Its effect is included in the measured allowance above.</text>
    <line x1="28" y1="835" x2="932" y2="835" class="divider"/>
    <text x="44" y="856" class="text" font-weight="600">ExtraOutputBuffers</text>
    <text x="278" y="856" class="text">Adds playback safety: 2 ms per extra buffer at 96 samples; 1 ms at 48 samples.</text>
    <line x1="28" y1="870" x2="932" y2="870" class="divider"/>
    <text x="44" y="891" class="text" font-weight="600">Latency offsets</text>
    <text x="278" y="891" class="text">Correct recording placement. They do not make sound arrive sooner.</text>
  </g>
  <text x="28" y="930" class="muted" font-size="14">These are UMC22 examples. Other settings or interfaces can behave differently; measure your setup.</text>
  </g>
</svg>
