<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" width="960" height="950" role="img" aria-labelledby="title description" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">What adds up to the audio delay?</title>
  <desc id="description">A rounded example for 96 samples at 48 kHz, accepted 3 ms USB capture requests and one extra output buffer. Each audio buffer holds 2 ms of sound. The driver estimates input as 2 ms to fill a buffer, 2 ms kept ready as a reserve, and about 6 ms of remaining delay estimated from UMC22 cable tests: about 10 ms input. Output adds a normal 2 ms buffer and an extra 2 ms safety buffer: 4 ms output. The total estimate is about 14 ms. The split is a model; a cable test measures only the combined delay. Other setups can differ.</desc>
  <style>
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .divider { stroke: #d1d9e0; }
    .neutral { fill: #f6f8fa; stroke: #d1d9e0; }
    .input { fill: #ddf4ff; stroke: #0969da; }
    .output { fill: #fff1e5; stroke: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .divider { stroke: #3d444d; }
      .neutral { fill: #161b22; stroke: #3d444d; }
      .input { fill: #0c2d4f; stroke: #4493f8; }
      .output { fill: #3d1d00; stroke: #f0883e; }
    }
  </style>
  <rect class="bg" width="960" height="950" rx="8"/>

  <text x="28" y="36" class="text" font-size="25" font-weight="600">What adds up to the delay?</text>
  <text x="28" y="62" class="muted" font-size="15">Example: 96 samples at 48 kHz · 3 ms USB capture requests accepted · 1 extra output buffer</text>
  <rect class="neutral" x="28" y="78" width="904" height="50" rx="7"/>
  <text x="44" y="110" class="text" font-size="18" font-weight="600">One buffer holds 2 ms of sound.</text>
  <text x="916" y="109" class="muted" font-size="14" text-anchor="end">Times are rounded. No calibration offsets.</text>

  <text x="28" y="166" class="text" font-size="18" font-weight="600">1. Input: getting sound into your audio program</text>
  <rect class="input" x="28" y="182" width="904" height="184" rx="7"/>
  <g class="text" font-size="30" font-weight="600">
    <text x="60" y="224">2 ms</text>
    <text x="362" y="224">2 ms</text>
    <text x="664" y="224">6 ms</text>
  </g>
  <g class="text" font-size="16" font-weight="600">
    <text x="60" y="253">Fill an input buffer</text>
    <text x="362" y="253">Keep a little input ready</text>
    <text x="664" y="253">Other delay in the estimate</text>
  </g>
  <g class="muted" font-size="15">
    <text x="60" y="280">Collect one chunk of sound</text>
    <text x="60" y="301">before passing it to the program.</text>
    <text x="362" y="280">Keep one chunk as a reserve</text>
    <text x="362" y="301">in case new input arrives late.</text>
    <text x="664" y="280">USB and interface delays, estimated</text>
    <text x="664" y="301">from UMC22 cable tests.</text>
  </g>
  <g class="muted" font-size="27" text-anchor="middle">
    <text x="326" y="225">+</text>
    <text x="628" y="225">+</text>
  </g>
  <text x="480" y="345" class="text" font-size="23" font-weight="600" text-anchor="middle">2 + 2 + 6 = about 10 ms input</text>
  <text x="28" y="391" class="muted" font-size="14">The 6 ms comes from measurements. The buffer settings alone cannot tell us this part.</text>

  <text x="28" y="431" class="text" font-size="18" font-weight="600">2. Output: getting sound back to the output jack</text>
  <rect class="output" x="28" y="447" width="904" height="112" rx="7"/>
  <g class="text" font-size="30" font-weight="600">
    <text x="60" y="484">2 ms</text>
    <text x="518" y="484">2 ms</text>
  </g>
  <g class="text" font-size="16" font-weight="600">
    <text x="60" y="510">Normal playback buffer</text>
    <text x="518" y="510">One extra safety buffer</text>
  </g>
  <text x="480" y="485" class="muted" font-size="27" text-anchor="middle">+</text>
  <text x="480" y="544" class="text" font-size="23" font-weight="600" text-anchor="middle">2 + 2 = 4 ms output</text>
  <text x="28" y="584" class="muted" font-size="14">Your audio program must process each chunk in time. Some plugins add further delay.</text>

  <rect class="neutral" x="28" y="604" width="904" height="60" rx="7"/>
  <text x="44" y="642" class="text" font-size="18" font-weight="600">Estimated total</text>
  <text x="916" y="643" class="text" font-size="25" font-weight="600" text-anchor="end">about 10 ms + 4 ms = about 14 ms</text>
  <text x="28" y="690" class="muted" font-size="14">Cable tests measured about 13–14 ms for this setup. Timing can vary between starts.</text>
  <text x="28" y="712" class="muted" font-size="14">The test measures the combined delay. The input/output split above is the driver's model.</text>

  <text x="28" y="751" class="text" font-size="18" font-weight="600">What the settings change</text>
  <g font-size="14">
    <text x="44" y="786" class="text" font-weight="600">BufferSize</text>
    <text x="278" y="786" class="text">Smaller chunks mean less waiting, but less time to finish processing.</text>
    <line x1="28" y1="800" x2="932" y2="800" class="divider"/>
    <text x="44" y="821" class="text" font-weight="600">CaptureBufferMs</text>
    <text x="278" y="821" class="text">Requests USB capture batches. A 3 ms batch is only part of the input delay.</text>
    <line x1="28" y1="835" x2="932" y2="835" class="divider"/>
    <text x="44" y="856" class="text" font-weight="600">ExtraOutputBuffers</text>
    <text x="278" y="856" class="text">Adds playback safety. Each extra buffer adds 2 ms in this example.</text>
    <line x1="28" y1="870" x2="932" y2="870" class="divider"/>
    <text x="44" y="891" class="text" font-weight="600">Latency offsets</text>
    <text x="278" y="891" class="text">Correct recording placement. They do not make sound arrive sooner.</text>
  </g>
  <text x="28" y="930" class="muted" font-size="14">This is one UMC22 example. Other settings or interfaces can behave differently; measure your setup.</text>
</svg>
